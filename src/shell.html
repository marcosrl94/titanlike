<title>Titanlike</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: parte de expedición en una columna. Muro de progreso arriba; escenario con titanes de pie sobre el horizonte; escuadrón y órdenes debajo. */
:root{
  color-scheme:dark;
  --stone:#1b1f1c; --stone-2:#252a26; --stone-3:#353c36; --stone-4:#4a534b;
  --bone:#ebe6d6; --muted:#9ca394;
  --cloak:#3f7a52; --cloak-hi:#7cc08f;
  --blood:#b5392f; --blood-hi:#e2685c; --flesh:#d79172; --flesh-2:#a8664c;
  --steel:#a9c3d2; --gold:#d8b45f;
  --sky-1:#27332f; --sky-2:#3a4a40; --sky-3:#59624a;
  --display:"Grenze Gotisch","Georgia",serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--stone);color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:14px 28px}
#app{max-width:900px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
#screen>div{display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:32px;line-height:1.05}
p{margin:0}
.lbl{font-family:var(--label);text-transform:uppercase;letter-spacing:.09em;font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:26px;line-height:1}
.brand b{color:var(--cloak-hi)}
.snd{margin-left:auto;display:flex;gap:6px}
.snd .off{opacity:.45;text-decoration:line-through}
.gas{display:flex;align-items:center;gap:8px}
.gasbar{display:flex;gap:2px}
.gasbar i{width:7px;height:16px;background:var(--stone-3)}
.gasbar i.on{background:var(--steel)}
.wall{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.sagabar{display:flex;gap:6px;margin-bottom:8px}
.sagabar span{flex:1;height:4px;background:var(--stone-3)}
.sagabar span.done{background:var(--cloak-hi)} .sagabar span.now{background:var(--gold)}
.wall span{height:14px;background:var(--stone-3);border-bottom:3px solid var(--stone-4);position:relative}
.wall span.done{background:var(--cloak);border-color:var(--cloak-hi)}
.wall span.now{background:var(--gold);border-color:var(--bone)}
.wall span.boss{height:22px;margin-top:-8px}
.wall span.boss::after{content:"";position:absolute;inset:6px auto auto 50%;width:6px;height:6px;margin-left:-3px;background:var(--blood);border-radius:50%}
.zone{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}

.panel{background:var(--stone-2);border:1px solid var(--stone-3);padding:16px;display:flex;flex-direction:column;gap:10px}
.btn{background:var(--cloak);border:0;padding:11px 20px;font-family:var(--label);font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone)}
.btn:hover{background:var(--cloak-hi);color:var(--stone)}
.btn.ghost{background:transparent;border:1px solid var(--stone-4)}
.btn.ghost:hover{background:var(--stone-3);color:var(--bone)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* portada */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:end;border-bottom:1px solid var(--stone-3)}
.hero .txt{display:flex;flex-direction:column;gap:14px;padding-block:22px;min-width:0}
.hero h1{font-size:clamp(40px,9vw,70px);line-height:.95}
.hero h1 em{font-style:normal;color:var(--blood-hi)}
.hero p{max-width:52ch}
.peek{position:relative;height:230px;overflow:hidden;min-width:0}
.peek svg{position:absolute;left:50%;bottom:-118px;width:300px;margin-left:-150px;animation:risein 2.2s cubic-bezier(.2,.7,.2,1) both}
.peek::after{content:"";position:absolute;left:0;right:0;bottom:0;height:74px;border-top:5px solid var(--stone-4);
  background:repeating-linear-gradient(0deg,transparent 0 17px,var(--stone) 17px 18px),repeating-linear-gradient(90deg,var(--stone-3) 0 44px,var(--stone) 44px 45px)}
@keyframes risein{from{transform:translateY(90px)}}
@media (max-width:620px){.hero{grid-template-columns:1fr}.peek{height:170px;order:-1}}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.rules li{border-left:2px solid var(--cloak);padding-left:10px;color:var(--muted);min-width:0}
.rules b{color:var(--bone);font-weight:600;display:block}

/* sagas */
.sagas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.saga{position:relative;overflow:hidden}
.saga .n{font-family:var(--label);font-size:13px;letter-spacing:.1em;color:var(--gold)}
.saga:disabled{opacity:.45;cursor:not-allowed}
.saga ul{margin:0;padding-left:16px;color:var(--muted);font-size:13px}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.slot{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
/* los Nueve y escenas */
.nine{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
@media (max-width:620px){.nine{grid-template-columns:repeat(5,1fr)}}
.nc{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--label);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;min-width:0}
.nc .art{width:100%;animation:none;filter:brightness(0);opacity:.35}
.nc.got{color:var(--gold)} .nc.got .art{filter:none;opacity:1}
.chip.pwc{color:var(--gold)}
.order.pw{border-color:var(--gold);background:var(--stone-2)}
.order.pw b{color:var(--gold)}
.pt.tf{background:var(--stone-2);border-color:var(--gold)}
.pt.tf svg{object-fit:contain}
.note p{color:var(--gold)}
.scene{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:center;background:var(--stone-2);border:1px solid var(--stone-3);padding:18px}
@media (max-width:620px){.scene{grid-template-columns:1fr}.sart{max-width:180px}}
.sart .art{animation:sway 4.2s ease-in-out infinite;width:100%}
.sart svg,.sart img{display:block;width:100%;height:auto}
.stx{display:flex;flex-direction:column;gap:10px;min-width:0}
.stx p{max-width:60ch}
.ln{opacity:0;animation:lnin .6s ease-out forwards}
@keyframes lnin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* logros, códice y avisos */
.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--stone);border:1px solid var(--gold);padding:10px 18px;display:flex;flex-direction:column;gap:2px;min-width:260px;max-width:calc(100% - 32px);animation:toast 4.2s ease forwards;color:var(--bone)}
.toast b{font-family:var(--display);font-size:20px;color:var(--gold)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}8%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ach{border:1px solid var(--stone-3);padding:10px 12px;display:flex;flex-direction:column;gap:3px;color:var(--muted);min-width:0}
.ach b{color:var(--muted);font-weight:600}
.ach.got{border-color:var(--gold);background:var(--stone-2)} .ach.got b{color:var(--gold)}
.card.locked{opacity:.55} .card.locked .pt{filter:grayscale(1)}
.cx.unk .art,.cx.unk .pt{filter:brightness(0);opacity:.35}
.panel.daily{border-color:var(--gold)}
/* previsión, objetos y fases */
.prev{font-family:var(--label);font-size:14px;letter-spacing:.04em;color:var(--steel)}
.prev.kill{color:var(--cloak-hi);font-weight:600}
.items{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.items .sel{border-color:var(--gold)}
.titan.enraged .plate{border-color:var(--blood-hi);box-shadow:0 0 0 2px var(--blood) inset}
/* móvil, fichas y encuadre */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(10,12,11,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet-in{background:var(--stone-2);border:1px solid var(--stone-4);border-top:3px solid var(--gold);padding:16px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:6px;color:var(--bone)}
.sheet-in b{font-family:var(--display);font-size:22px}
.sheet-in p b{font-family:var(--body);font-size:inherit}
.fit{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.fit .btn{padding:2px 8px;min-width:30px}
@media (pointer:coarse){
  .order{min-height:64px}
  .btn{min-height:44px}
  .btn.sm{min-height:40px}
  .node circle{stroke-width:3}
}
@media (max-width:620px){
  #app .titans{min-height:200px;gap:4px}
  #app .plate h3{font-size:15px}
  #app .plate .chip{display:none}
  #app .prev,#app .int{font-size:12px}
  #app .stage{padding:12px 6px 0}
  #app .squad{grid-template-columns:1fr 1fr;gap:6px}
  #app .sol{flex-direction:column;align-items:flex-start;gap:6px;padding:8px}
  #app .sol .pt{width:44px;height:44px}
  #app .hero h1{font-size:44px}
}
button,[role=button]{touch-action:manipulation}
/* menú y ajustes */
#menu{position:fixed;inset:0;z-index:70;background:rgba(10,12,11,.65);display:flex;justify-content:flex-end}
.menu-in{width:min(380px,100%);height:100%;overflow-y:auto;background:var(--stone);border-left:1px solid var(--stone-4);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.mi{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--stone-2);border:1px solid var(--stone-3);padding:12px 14px;color:var(--bone)}
.mi b{font-family:var(--display);font-size:21px;font-weight:700}
.mi span{font-size:13px;color:var(--muted)}
button.mi:hover:not(:disabled),button.mi:focus-visible{border-color:var(--gold)}
.mi:disabled{opacity:.45;cursor:not-allowed}
.mi.warn{border-color:var(--blood)} .mi.warn .row{margin-top:6px}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-top:1px solid var(--stone-3);flex-wrap:wrap}
.set:first-of-type{border-top:0}
.set>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}
.set span{color:var(--muted);font-size:13px}
.set.col{flex-direction:column;align-items:stretch}
.set.col>div:first-child{flex:none}
.set input[type=range]{flex:1 1 200px;max-width:320px;accent-color:var(--cloak-hi)}
.set textarea{width:100%;background:var(--stone);color:var(--bone);border:1px solid var(--stone-4);font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px;resize:vertical}
.sw{min-width:64px;border:1px solid var(--stone-4);background:var(--stone);padding:6px 10px;font-family:var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sw.on{background:var(--cloak);border-color:var(--cloak-hi);color:var(--bone)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.btn.danger{background:var(--blood)} .btn.danger:hover{background:var(--blood-hi)}
#bmenu{margin-left:4px}
body.calm *,body.calm *::before,body.calm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
body.big #app{zoom:1.12}
/* consejos e intenciones */
.tip{display:flex;flex-direction:column;gap:6px;background:var(--stone-2);border:1px solid var(--stone-3);border-left:3px solid var(--gold);padding:12px 16px}
.tip b{font-family:var(--display);font-size:22px;font-weight:700}
.tip p{max-width:70ch;color:var(--bone)}
.tip .lbl{color:var(--gold)}
.int{font-family:var(--label);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--blood-hi);cursor:help}
.int.all{color:var(--bone);background:var(--blood);padding:0 6px}
/* fichas y retratos */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.card{background:var(--stone-2);border:1px solid var(--stone-3);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
button.card:hover{border-color:var(--gold);background:var(--stone-3)}
.card h3{font-size:24px;line-height:1}
.card p{color:var(--muted);font-size:14px}
.card p b{color:var(--bone);font-weight:600}
.card .kind{color:var(--gold)}
.who{display:flex;gap:10px;align-items:center}
.who>div{display:flex;flex-direction:column;gap:5px;min-width:0}
.pt{display:block;width:62px;height:62px;flex:none;border:1px solid var(--stone-4);background:var(--stone-3);overflow:hidden}
.pt.lg{width:84px;height:84px}
.pt svg,.pt img{display:block;width:100%;height:100%;object-fit:cover}
.stats{display:flex;gap:12px;font-family:var(--label);font-size:15px}
.stats b{color:var(--muted);font-weight:500;margin-right:3px}
.chip{display:inline-block;font-family:var(--label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border:1px solid currentColor;white-space:nowrap}
.s-veloz{color:var(--steel)} .s-fuerza{color:var(--blood-hi)} .s-tactico{color:var(--gold)} .s-preciso{color:var(--cloak-hi)}
.c-cls{color:var(--flesh)}

/* mapa */
.mapwrap{background:var(--stone-2);border:1px solid var(--stone-3);padding:8px}
.map{width:100%;height:auto;display:block}
.map .edge{stroke:var(--stone-4);stroke-width:2;stroke-dasharray:4 6;fill:none}
.map .edge.walk{stroke:var(--cloak-hi);stroke-dasharray:none;stroke-width:3}
.map .edge.open{stroke:var(--gold)}
.node circle{fill:var(--stone);stroke:var(--stone-4);stroke-width:2}
.node .ic{stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.node .q{font-family:var(--display);font-size:26px;fill:var(--muted);text-anchor:middle}
.node text.nm{font-family:var(--label);font-size:11px;fill:var(--muted);text-anchor:middle;letter-spacing:.08em;text-transform:uppercase}
.node.done circle{fill:var(--cloak);stroke:var(--cloak-hi)}
.node.done .ic{stroke:var(--bone)} .node.done .q{fill:var(--bone)}
.node.open{cursor:pointer}
.node.open circle{stroke:var(--gold);stroke-width:3;animation:pulse 1.6s ease-in-out infinite}
.node.open .ic{stroke:var(--bone)} .node.open .q,.node.open text.nm{fill:var(--bone)}
.node.open:hover circle,.node.open:focus-visible circle{fill:var(--stone-4)}
.node.b circle{stroke:var(--blood)} .node.b .ic{stroke:var(--blood-hi)}
.node .dia{fill:var(--blood-hi);stroke:none}
@keyframes pulse{50%{stroke-width:7}}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.legend b{color:var(--bone);font-weight:600}

/* escenario */
.stage{position:relative;border:1px solid var(--stone-3);padding:16px 16px 0;overflow:hidden;background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 58%,var(--sky-3))}
.stage::before{content:"";position:absolute;left:0;right:0;top:34%;height:30px;opacity:.5;border-top:3px solid var(--stone-4);
  background:repeating-linear-gradient(90deg,var(--stone-3) 0 40px,var(--stone-2) 40px 42px)}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--stone-2);border-top:2px solid var(--stone-4)}
.titans{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-end;gap:8px;min-height:250px}
.titan{background:none;border:0;padding:0 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1 1 0;max-width:230px;min-width:0;position:relative;text-align:center}
.titan.boss{max-width:340px}
.art{display:block;width:100%;transform-origin:50% 100%;animation:sway 4.2s ease-in-out infinite}
.art svg,.art img{display:block;width:100%;height:auto}
.z-pequeno .art{width:62%} .z-anormal .art{width:84%}
.plate{background:var(--stone);border:1px solid var(--stone-4);padding:5px 8px;width:100%;display:flex;flex-direction:column;gap:3px;align-items:center;min-width:0}
.plate h3{font-size:18px;line-height:1.05}
.titan.boss .plate{border-color:var(--blood)}
.titan.pick .plate{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.titan.pick{cursor:pointer}
.titan.pick:hover .art{filter:brightness(1.25)}
.titan.dead .art{animation:none;transform:translateY(20px) scaleY(.45);opacity:.14;filter:grayscale(1)}
.titan.dead .plate{opacity:.4}
.eff{position:absolute;top:0;right:4px;font-family:var(--label);font-size:15px;padding:0 6px;z-index:2;color:var(--bone)}
.eff.up{background:var(--cloak)} .eff.down{background:var(--blood)}
.bar{width:100%;height:8px;background:var(--stone-3)}
.bar i{display:block;height:100%;background:var(--blood-hi);transition:width .3s}
.bar.hp i{background:var(--cloak-hi)}
.st{font-family:var(--label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);min-height:16px}
.log{font-size:14px;color:var(--muted);min-height:64px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;border-left:2px solid var(--stone-4);padding-left:10px}
.log div:last-child{color:var(--bone)}
.squad{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.sol{background:var(--stone-2);border:1px solid var(--stone-3);padding:8px;display:flex;gap:10px;align-items:center;text-align:left;min-width:0;position:relative}
.sol .inf{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.sol.active{border-color:var(--cloak-hi);background:var(--stone-3);box-shadow:0 -3px 0 var(--cloak-hi) inset}
.sol.pick{border-color:var(--gold);cursor:pointer}
.sol.dead{opacity:.3;filter:grayscale(1)}
.sol h3{font-size:19px;line-height:1;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.sol h3 small{font-family:var(--label);font-size:13px;color:var(--muted);font-weight:500}
.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.order{background:var(--stone-3);border:1px solid var(--stone-4);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.order:hover:not(:disabled){border-color:var(--cloak-hi)}
.order.sel{border-color:var(--gold)}
.order:disabled{opacity:.4;cursor:not-allowed}
.order b{font-family:var(--label);font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.order span{font-size:13px;color:var(--muted)}
.hint{color:var(--gold);min-height:22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.relics{display:flex;gap:6px;flex-wrap:wrap}
.relics .chip{color:var(--muted)}
.fallen{color:var(--muted);margin:0;padding-left:18px}
.chart{width:100%;border-collapse:collapse;font-size:13px}
.chart td{padding:3px 6px;border-bottom:1px solid var(--stone-3)}
.tablewrap{overflow-x:auto}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal .card{align-items:flex-start}
.gal input{max-width:100%;font-size:12px}
.gal .art{width:84px;animation:none}

/* efectos */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx svg{position:absolute;inset:0;width:100%;height:100%}
.wire{stroke:var(--steel);stroke-width:1.5;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .15s linear forwards,fade .25s .3s forwards}
.slash{stroke:var(--bone);stroke-width:6;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .12s ease-out forwards,fade .3s .14s forwards}
.slash.crit{stroke:var(--gold);stroke-width:9}
.bolt{stroke:var(--gold);stroke-width:7;fill:none;stroke-linejoin:bevel;animation:fade .5s .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:0}}
.float{position:absolute;font-family:var(--display);font-weight:700;font-size:32px;color:var(--bone);text-shadow:0 2px 0 var(--stone),0 0 10px var(--stone);animation:rise .95s ease-out forwards;white-space:nowrap}
.float.crit{font-size:48px;color:var(--gold)}
.float.bad{color:var(--blood-hi)} .float.good{color:var(--cloak-hi)}
.float.tag{font-family:var(--label);font-size:19px;letter-spacing:.14em;color:var(--gold)}

/* ---- efectos nuevos: --k es la velocidad de animación (1 normal, .5 rápida) ---- */

.spark{position:absolute;width:3px;height:16px;margin:-8px -1.5px;border-radius:2px;transform:rotate(var(--a)) translateY(0);animation:spark calc(.55s*var(--k)) ease-out forwards}
@keyframes spark{from{opacity:1}to{transform:rotate(var(--a)) translateY(calc(-1*var(--d))) scaleY(.3);opacity:0}}
.ring{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border:4px solid;border-radius:50%;opacity:0;animation:ring calc(.75s*var(--k)) ease-out forwards}
@keyframes ring{0%{transform:scale(.1);opacity:.95;border-width:10px}100%{transform:scale(1);opacity:0;border-width:1px}}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,var(--c) 100%);animation:vig calc(1s*var(--k)) ease-out forwards}

.heat{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 45%,rgba(255,150,70,.45),rgba(255,110,40,.18) 55%,transparent 80%);mix-blend-mode:screen;animation:heat calc(1.1s*var(--k)) ease-in-out forwards}

@keyframes shard{from{transform:rotate(var(--a)) translateY(0) rotate(0);opacity:1}to{transform:rotate(var(--a)) translateY(calc(-1*var(--d))) rotate(var(--r));opacity:0}}
.rock{position:absolute;border-radius:40% 55% 45% 60%;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35);animation:rock calc(.9s*var(--k)) cubic-bezier(.5,0,.9,.6) both}
@keyframes rock{0%{transform:translateY(0) rotate(0);opacity:1}88%{opacity:1}100%{transform:translateY(var(--y)) rotate(var(--r));opacity:0}}
.spike{position:absolute;width:20px;height:var(--h);margin-left:-10px;clip-path:polygon(50% 0,100% 100%,0 100%);transform-origin:bottom;transform:translateY(-100%) scaleY(0);filter:drop-shadow(0 0 6px #fff);animation:spike calc(1.1s*var(--k)) cubic-bezier(.2,1.4,.4,1) both}

.acc.slim{padding:12px 14px}
.panel .acc{box-shadow:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.file{cursor:pointer}
.gal .card{gap:8px}
.gal .card b{font-weight:600}
.logins{display:flex;flex-direction:column;align-items:flex-start;gap:10px;flex:1 1 260px}
.linkb{background:none;border:0;padding:4px 2px;color:var(--cloak-hi);font:500 14px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkb:hover{color:var(--bone)}
.mailf{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld span{font-size:13px;color:var(--muted)}
.fld input,#nm{background:var(--stone);color:var(--bone);border:1px solid var(--stone-4);border-radius:var(--r-sm);padding:11px 12px;font:16px var(--body);width:100%}
.fld input:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}
.mailf .seg{align-self:flex-start}
.traits{color:var(--steel);letter-spacing:.06em}
.patch-in{max-height:min(80vh,720px);overflow-y:auto;max-width:640px}
.patch{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.patch b{font-family:var(--display);font-size:22px}
.patch ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--bone)}
.patch li::marker{color:var(--gold)}
.panel.ng{border-color:rgba(216,180,95,.55);background:linear-gradient(135deg,rgba(216,180,95,.12),var(--stone-2) 55%)}
.panel.ng p b{color:var(--gold)}
.note-s{font-size:13.5px;color:var(--muted);background:var(--stone-2);border:1px solid var(--stone-3);border-radius:var(--r-sm);padding:10px 12px}
/* portada */
.cta{display:flex;gap:10px;flex-wrap:wrap}
.cta2{display:flex;gap:8px;flex-wrap:wrap}
.cta2 .btn{padding:9px 14px;font-size:15px}
.hero{border-bottom:0}
/* progreso */
#prog{display:flex;flex-direction:column;gap:6px}
#prog .zone{margin-top:0;align-items:center}
.gas{gap:8px}
/* combate */
.plate .st:empty{display:none}
.log{min-height:0;border-left:0;padding:8px 12px;background:rgba(37,42,38,.55);border-radius:var(--r-sm);font-size:13.5px}
.log:empty{display:none}
.log div:not(:last-child){opacity:.75}
.order{background:var(--stone-2);border-color:var(--stone-3)}
.order:hover:not(:disabled){background:var(--stone-3)}
.order.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:var(--stone-3)}
.dock{display:flex;flex-direction:column;gap:8px}
.sol.active{box-shadow:0 0 0 1px var(--cloak-hi) inset}
.sol .inf{align-self:stretch}
.sol .bar{width:100%}
/* interruptores */
.sw{position:relative;width:52px;min-width:52px;height:30px;border-radius:999px;border:1px solid var(--stone-4);background:var(--stone);padding:0;transition:background .2s,border-color .2s}
.sw span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:999px;background:var(--muted);transition:transform .2s var(--ease),background .2s}
.sw.on{background:var(--cloak);border-color:var(--cloak-hi)}
.sw.on::after{transform:translateX(22px);background:var(--bone)}
.seg{background:var(--stone);border:1px solid var(--stone-4);border-radius:999px;padding:3px;gap:2px}
.seg .btn{border-radius:999px;border:0;box-shadow:none;min-height:34px}
.seg .btn.ghost{background:transparent;color:var(--muted)}
input[type=range]{height:28px}
/* menú lateral */
.menu-in{gap:8px;box-shadow:-20px 0 40px -20px rgba(0,0,0,.7);animation:slidein .22s var(--ease)}
@keyframes slidein{from{transform:translateX(24px);opacity:.4}}
.mi{position:relative;padding:12px 40px 12px 14px}
.mi b{font-family:var(--body);font-size:16px;font-weight:600}
button.mi::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:translateY(-50%) rotate(45deg)}
.menu-in .acc{margin-bottom:4px}
/* fichas, avisos, consejos */
.sheet-in{border-radius:16px 16px var(--r) var(--r);box-shadow:0 -10px 40px -10px rgba(0,0,0,.7);animation:sheetup .22s var(--ease)}
@keyframes sheetup{from{transform:translateY(24px);opacity:.4}}
.toast{box-shadow:0 12px 40px -12px rgba(0,0,0,.8);top:calc(70px + env(safe-area-inset-top,0px));bottom:auto;height:auto}
.tip{border-left-width:1px;border-color:rgba(216,180,95,.5);background:linear-gradient(135deg,rgba(216,180,95,.1),var(--stone-2) 50%)}
.tip b{font-size:20px}
.card h3{font-size:22px}
#nm{border-radius:var(--r-sm)}
/* escenario a lo Pokémon: fichas enemigas arriba a la izquierda, titanes al fondo a la derecha, nuestros soldados delante */
.stage.poke{height:clamp(300px,54vh,600px);padding:0}
.stage.poke .titans{position:absolute;inset:0 2% 0 36%;min-height:0;justify-content:flex-end;align-items:flex-end;padding:8px 0 64px;gap:6px}
/* las figuras se dimensionan por altura para caber siempre en el escenario */
.stage.poke .titan{padding:0;max-width:none;flex:0 1 auto;height:100%;justify-content:flex-end}
.stage.poke .titan .art{width:auto;height:88%;display:flex;align-items:flex-end;justify-content:center}
.stage.poke .titan .art svg,.stage.poke .titan .art img{height:100%;width:auto;max-width:100%;object-fit:contain}
.stage.poke .z-pequeno .art{height:58%} .stage.poke .z-anormal .art{height:76%} .stage.poke .z-grande .art{height:86%} .stage.poke .titan.boss .art{height:96%}
.plates{position:absolute;top:10px;left:10px;z-index:4;display:flex;flex-direction:column;gap:6px;max-width:min(300px,52%)}
.plates .plate{width:100%;align-items:flex-start;text-align:left;padding:6px 10px;background:rgba(27,31,28,.92);border:1px solid var(--stone-4);border-radius:var(--r-sm);color:var(--bone);cursor:default;gap:3px}
.plates .plate h3{font-size:17px;line-height:1.05}
.plates .plate .eff{position:static;font-size:13px}
.plates .plate .bar{width:100%}
.plates .plate.boss{border-color:var(--blood)}
.plates .plate.dead{opacity:.4}
.plates .plate.dying{opacity:.4}
.plates button.plate.pick{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 2px rgba(216,180,95,.35)}
.plates button.plate.pick:hover{background:rgba(53,60,54,.95)}
.plates .plate.struck{animation:struck .32s}
/* varios enemigos: fichas compactas en fila arriba y figuras algo más bajas */
.plates.multi{flex-direction:row;flex-wrap:wrap;left:10px;right:10px;max-width:none;gap:6px;align-items:flex-start}
.plates.multi .plate{flex:1 1 0;min-width:0;max-width:230px;padding:5px 8px;gap:2px}
.plates.multi .plate h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plates.multi .plate .chip{display:none}
.plates.multi .plate .st,.plates.multi .plate .prev,.plates.multi .plate .int{font-size:11px}
.stage.poke.multi .z-pequeno .art{height:50%} .stage.poke.multi .z-anormal .art{height:64%} .stage.poke.multi .z-grande .art{height:72%} .stage.poke.multi .z-blindado .art{height:72%} .stage.poke.multi .titan.boss .art{height:80%}
.titan.pick .art{filter:drop-shadow(0 0 10px rgba(216,180,95,.7))}
.titan.enraged .art{filter:drop-shadow(0 0 10px rgba(226,104,92,.55))}
.titan.pick .plate{box-shadow:none}
.heroes{position:absolute;left:12px;bottom:6px;z-index:3;display:flex;align-items:flex-end;gap:8px}
.spr{display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:0;padding:0;width:66px;color:var(--bone);position:relative;transition:transform .15s}
.spr .pt{width:54px;height:54px;border-radius:999px;border:2px solid var(--stone-4);box-shadow:0 8px 16px -8px #000;background:var(--stone-3);transition:transform .2s,border-color .2s}
.spr .sh{display:block;width:40px;height:9px;border-radius:50%;background:rgba(0,0,0,.5);margin-top:-5px;filter:blur(1px)}
.spr .nm{font-family:var(--label);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone);text-shadow:0 1px 2px #000,0 0 6px #000;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
.spr.active{transform:translateY(-4px)} .spr.active .pt{border-color:var(--cloak-hi);box-shadow:0 0 0 3px rgba(124,192,143,.35),0 8px 16px -8px #000}
.spr.pick{cursor:pointer} .spr.pick .pt{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,180,95,.4)}
.spr.pick:hover .pt{transform:scale(1.08)}
.spr.guard .pt{border-color:var(--steel)}
.spr.stunned .pt{transform:rotate(-24deg) translateY(6px)}
.spr.dead{opacity:.35;filter:grayscale(1)} .spr.dead .pt{transform:rotate(82deg) translateY(10px)}
.spr .pt.tf{border-color:var(--gold)}
.spr.lunge{animation:sprlunge .34s ease-out}
@keyframes sprlunge{40%{transform:translate(28px,-14px) scale(1.08)}}
.spr.struck{animation:struck .32s}
.bar.plate{height:5px;margin-top:-2px} .bar.plate i{background:var(--steel)}
@media (max-width:620px){
  .stage.poke{height:340px}
  .stage.poke .titans{inset:0 0 0 30%;padding-bottom:54px}
  .plates{max-width:62%;gap:4px}
  .plates .plate{padding:5px 8px} .plates .plate h3{font-size:14px} .plates .plate .st,.plates .plate .prev,.plates .plate .int{font-size:11px}
  .plates.multi{left:6px;right:6px;gap:4px;max-width:none}
  .plates.multi .plate{padding:4px 6px} .plates.multi .plate h3{font-size:12px} .plates.multi .plate .hpn{font-size:10px} .plates.multi .plate .eff{font-size:11px;padding:0 4px}
  .plates.multi .plate .st,.plates.multi .plate .prev,.plates.multi .plate .int{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .stage.poke.multi .titans{inset:0 0 0 4%}
  .heroes{left:6px;bottom:4px;gap:3px}
  .spr{width:46px} .spr .pt{width:38px;height:38px} .spr .sh{width:28px;height:6px} .spr .nm{font-size:9px;max-width:48px}
}
/* combate a lo ancho: escenario a la izquierda, escuadrón y órdenes a la derecha; cabe sin scroll desde 1280×720 */
.cg{display:flex;flex-direction:column;gap:12px}
.cg-l,.cg-r{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (min-width:980px){
  body.wide #app{max-width:1280px}
  body.wide #screen>div{gap:10px}
  .cg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,.95fr);gap:16px;align-items:start}
  .cg-l .stage{padding:12px 12px 0}
  .cg.mg{grid-template-columns:minmax(0,1.3fr) minmax(300px,.8fr)}
  .cg.mg .legend{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));font-size:12.5px;gap:4px 10px}
  .cg.mg .squad{grid-template-columns:1fr}
  .cg.mg .sol{padding:7px}
  .cg.mg .mapwrap{max-width:720px}
  .cg-l .log{max-height:112px;overflow:hidden}
  .cg-r .squad{grid-template-columns:1fr 1fr;gap:8px}
  .cg-r .sol{padding:7px}
  .cg-r .sol .pt{width:48px;height:48px}
  .cg-r .orders{grid-template-columns:1fr 1fr;gap:8px}
  .cg-r .order{padding:8px 10px;min-height:0}
  .cg-r .order span{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cg-r .order:only-child,.cg-r .order:nth-child(odd):last-of-type{grid-column:1/-1}
  .cg-r .items{grid-column:1/-1}
  .cg-r .relics{gap:4px}
  .cg-r .relics .chip{font-size:11px}
}
@media (min-width:980px) and (max-height:760px){
  body.wide .top{padding:6px 16px}
  body.wide #prog{gap:3px}
  body.wide .wall span{height:10px;border-bottom-width:2px}
  body.wide .wall span.boss{height:16px;margin-top:-6px}
  body.wide .sagabar{margin-bottom:4px}
  .stage.poke{height:clamp(280px,50vh,420px)}
  .cg-r .sol h3{font-size:16px}
  .cg-r .sol .st{min-height:0}
}
/* móvil */
@media (max-width:620px){
  body{font-size:15px}
  .top{gap:8px}
  .brand{font-size:23px}
  #bmenu span{display:none}
  #bmenu{width:40px;padding:0;justify-content:center}
  #app .hin span{display:none}
  #app .hin{width:40px;padding:0}
  .cta .btn,.cta2 .btn{flex:1 1 100%}
  .cta2{display:grid;grid-template-columns:1fr 1fr}
  .cta2 .btn{min-width:0;white-space:normal;text-align:center}
  .acc .gbtn,.logins{width:100%}
  .mailf{max-width:none}
  .peek{height:170px}
  .peek svg{width:220px;margin-left:-110px;bottom:-100px}
  .cta2 .btn:last-child:nth-child(odd){grid-column:1/-1}
  #app .hero h1{font-size:46px}
  #app .rules{grid-template-columns:1fr 1fr;gap:12px}
  #app .rules li{font-size:13.5px}
  /* escuadrón compacto */
  #app .squad{grid-template-columns:1fr 1fr;gap:6px}
  #app .sol{flex-direction:row;align-items:center;gap:8px;padding:8px}
  #app .sol .pt{width:38px;height:38px}
  #app .sol h3{font-size:16px}
  #app .sol .chip{font-size:10.5px;padding:0 6px}
  #app .sol .st{font-size:10.5px;min-height:0}
  #app .sol .hpn{font-size:11px}
  /* panel de órdenes fijo abajo */
  .dock{position:sticky;bottom:0;z-index:30;margin-inline:-16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(27,31,28,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--stone-4)}
  .dock .orders{grid-template-columns:1fr 1fr;gap:6px}
  .dock .order{padding:7px 10px;min-height:50px;justify-content:center}

  .dock .order:only-child,.dock .order:nth-child(odd):last-of-type{grid-column:1/-1}

  .dock .hint{min-height:0}
  .dock .hint .btn{min-height:32px;padding:4px 10px;font-size:12px}
  #app .plate{padding:4px 6px}

  .menu-in{width:100%}

@media (max-width:380px){ .cta2{grid-template-columns:1fr} #app .squad{grid-template-columns:1fr} }

/* ---- 15.13: pantallas interiores con la línea anime (cabecera ilustrada, elecciones numeradas, Intendencia, fichas) ---- */
.lbl.sect{display:flex;align-items:center;gap:10px;color:var(--bone);opacity:.8;margin-top:6px}
.lbl.sect::before{content:'';width:14px;height:3px;background:var(--gold);transform:skewX(-30deg);flex:none}
.lbl.sect::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--stone-4),transparent)}
.shero{position:relative;overflow:hidden;border-radius:16px;min-height:150px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 24px;border:1px solid rgba(255,255,255,.07);background:#0b0d0c;isolation:isolate;box-shadow:0 18px 40px -24px rgba(0,0,0,.9)}
.shero.big{min-height:196px}
.sh-art{position:absolute;inset:0;z-index:-3}
.sh-art svg{width:100%;height:100%;display:block;filter:saturate(.85) brightness(.8);animation:kenburns 30s ease-out both}
.shero::after{content:'';position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(8,10,9,.94) 0%,rgba(8,10,9,.72) 45%,rgba(8,10,9,.12) 100%),linear-gradient(transparent 45%,rgba(8,10,9,.8))}
.shero>.sl{z-index:-1;opacity:.28;inset:-90% -30% -90% 35%}
.sh-ht{position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.4px);background-size:6px 6px;-webkit-mask:linear-gradient(250deg,#000,transparent 45%);mask:linear-gradient(250deg,#000,transparent 45%)}
.sh-tx{display:flex;flex-direction:column;gap:4px;max-width:64ch;position:relative;min-width:0}
.sh-tx .lbl{color:var(--gold);display:flex;align-items:center;gap:8px}
.sh-tx .lbl::before{content:'';width:22px;height:3px;background:var(--gold);transform:skewX(-30deg)}
.sh-tx h2{font-size:clamp(30px,4.4vw,46px);line-height:1;margin:0;text-shadow:0 3px 18px rgba(0,0,0,.85);animation:lnin .5s .05s both}
.sh-tx p{margin:6px 0 0;color:var(--bone);opacity:.86;animation:lnin .5s .15s both;text-shadow:0 1px 6px #000}
.sh-sfx{position:absolute;right:24px;top:16px;font-size:clamp(28px,5vw,56px);color:var(--gold);-webkit-text-stroke:6px #0a0b0b;transform:skewX(-8deg) rotate(-6deg);animation:stampin .55s cubic-bezier(.2,1.6,.4,1) .2s both;z-index:1}
.sh-side{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 16px;border-radius:14px;background:rgba(10,12,11,.66);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);flex:none;position:relative;overflow:hidden}
.sh-side b{font-family:var(--label);font-size:40px;line-height:1;color:var(--gold)}
.sh-side small{font-size:11px;color:var(--muted);text-align:center;max-width:110px}
.sh-side.medal{width:150px;height:150px;border-radius:50%;justify-content:center;background:radial-gradient(circle,rgba(30,26,14,.95) 46%,rgba(10,12,11,.55) 70%);border:2px solid rgba(216,180,95,.55);box-shadow:0 0 0 6px rgba(216,180,95,.08),0 0 40px -6px rgba(216,180,95,.4)}
.sh-side.medal .sl{inset:-40%;opacity:.7;background:repeating-conic-gradient(from 0deg,rgba(255,211,106,.35) 0deg 1.4deg,transparent 1.4deg 8deg);-webkit-mask:radial-gradient(circle,transparent 42%,#000 58%,transparent 74%);mask:radial-gradient(circle,transparent 42%,#000 58%,transparent 74%)}
.sh-side.medal b{font-size:48px;position:relative;text-shadow:0 0 18px rgba(255,211,106,.45)} .sh-side.medal .lbl,.sh-side.medal small{position:relative}
.shero.intd{background:radial-gradient(120% 140% at 85% 30%,#3a2f17 0%,#141713 55%,#0b0d0c 100%);align-items:center}
.shero.camp .fire{position:absolute;left:62%;bottom:-40px;width:340px;height:240px;z-index:-2;background:radial-gradient(closest-side,rgba(255,150,60,.55),rgba(226,104,92,.18) 55%,transparent);mix-blend-mode:screen;animation:flick 2.6s ease-in-out infinite}
.shero.camp .embers{position:absolute;left:66%;bottom:0;width:120px;height:160px;z-index:-1;background-image:radial-gradient(#ffc070 1.2px,transparent 1.8px),radial-gradient(#ff8a4a 1px,transparent 1.6px);background-size:34px 46px,22px 30px;animation:embup 3.4s linear infinite;-webkit-mask:linear-gradient(transparent,#000 40%,transparent);mask:linear-gradient(transparent,#000 40%,transparent);opacity:.8}
@keyframes flick{0%,100%{opacity:.85;transform:scale(1)}40%{opacity:1;transform:scale(1.05)}70%{opacity:.75;transform:scale(.97)}}
@keyframes embup{from{background-position:0 0,10px 0}to{background-position:0 -92px,10px -60px}}
/* elecciones numeradas */
.cards.chs{gap:12px}
.card.ch{position:relative;overflow:hidden;border-radius:14px;padding:16px 16px 16px 20px;background:linear-gradient(160deg,#2a302b 0%,#1f2420 100%);border:1px solid rgba(255,255,255,.07);box-shadow:0 10px 26px -18px rgba(0,0,0,.9);transition:transform .14s var(--ease,ease),border-color .15s,box-shadow .15s}
.card.ch::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,var(--stone-4))}
.card.ch::after{content:'';position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.4px);background-size:6px 6px;-webkit-mask:radial-gradient(circle at 70% 70%,#000,transparent 70%);mask:radial-gradient(circle at 70% 70%,#000,transparent 70%)}
button.card.ch:hover:not(:disabled),button.card.ch:focus-visible{transform:translateY(-3px);border-color:var(--acc,var(--gold));box-shadow:0 16px 30px -18px rgba(0,0,0,.95),0 0 0 1px var(--acc,var(--gold))}
.card.ch h3{font-size:21px;margin:0}
.card.ch p{margin:0;color:var(--muted)}
.chn{position:absolute;right:12px;top:10px;min-width:26px;height:24px;padding:0 6px;display:grid;place-items:center;font-family:var(--label);font-weight:700;font-size:14px;color:#0b0d0c;background:var(--acc,var(--bone));transform:skewX(-12deg);border-radius:4px;opacity:.9}
@media (hover:none){.chn{display:none}}
